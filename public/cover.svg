<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <!-- Lighting and Shading Filters -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001830" flood-opacity="0.18" />
    </filter>
    <filter id="innerDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#000000" flood-opacity="0.25" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>

    <!-- Gradients for Clothes (PLN Royal Blue) -->
    <linearGradient id="plnRoyalBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E6FD9" />
      <stop offset="45%" stop-color="#1457B8" />
      <stop offset="100%" stop-color="#0C3D88" />
    </linearGradient>

    <linearGradient id="plnDarkBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1453AB" />
      <stop offset="100%" stop-color="#0A2C63" />
    </linearGradient>

    <linearGradient id="plnBlazerBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F73E8" />
      <stop offset="50%" stop-color="#1558BA" />
      <stop offset="100%" stop-color="#0D3F8D" />
    </linearGradient>

    <linearGradient id="plnLapelBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1850A2" />
      <stop offset="100%" stop-color="#0F3875" />
    </linearGradient>

    <!-- Silver Reflective Stripe -->
    <linearGradient id="silverStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Skin Tones: Male -->
    <linearGradient id="maleSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCD5BE" />
      <stop offset="60%" stop-color="#F3B99B" />
      <stop offset="100%" stop-color="#DF9A78" />
    </linearGradient>

    <linearGradient id="maleShadowSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EAA684" />
      <stop offset="100%" stop-color="#CE825E" />
    </linearGradient>

    <!-- Skin Tones: Female -->
    <linearGradient id="femaleSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDDFD0" />
      <stop offset="50%" stop-color="#FAC8B4" />
      <stop offset="100%" stop-color="#EEAA94" />
    </linearGradient>

    <!-- White Hardhat Gradient -->
    <linearGradient id="hardhatWhite" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="85%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Hair Shading -->
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D1F1D" />
      <stop offset="50%" stop-color="#1A1110" />
      <stop offset="100%" stop-color="#0A0808" />
    </linearGradient>

    <!-- Tablet Gradient -->
    <linearGradient id="tabletMetallic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Yellow PLN Badge Color -->
    <linearGradient id="plnYellowBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF04B" />
      <stop offset="100%" stop-color="#FFD100" />
    </linearGradient>
  </defs>

  <!-- Transparent Background: No solid rect or backdrop glow -->

  <!-- ======================================================== -->
  <!-- 1. LEFT OFFICER: MALE PLN TECHNICIAN (SERAGAM BIRU PLN) -->
  <!-- ======================================================== -->
  <g id="plnTechnician" filter="url(#softShadow)">
    <!-- Trousers / Lower Body -->
    <path d="M 120 860 L 490 860 L 460 1200 L 110 1200 Z" fill="url(#plnDarkBlue)" />
    
    <!-- Belt & Buckle -->
    <rect x="150" y="855" width="310" height="30" rx="4" fill="#0F172A" />
    <rect x="230" y="852" width="55" height="36" rx="5" fill="#94A3B8" stroke="#475569" stroke-width="2.5" />
    <rect x="240" y="860" width="35" height="20" rx="3" fill="#E2E8F0" />
    <line x1="257" y1="854" x2="257" y2="886" stroke="#475569" stroke-width="3" />

    <!-- Left Arm & Hand In Pocket -->
    <!-- Arm coming down into front pocket -->
    <path d="M 400 500 L 485 640 L 495 860 L 415 880 L 375 750 L 350 510 Z" fill="url(#plnDarkBlue)" />
    <!-- Hand partially in pocket -->
    <path d="M 410 840 C 420 860, 450 865, 470 850 L 465 890 C 440 900, 410 880, 405 850 Z" fill="url(#maleShadowSkin)" />
    <!-- Trouser Pocket Flap -->
    <path d="M 390 880 L 475 870 L 465 970 L 380 970 Z" fill="#0A2C63" />

    <!-- Main Torso Uniform Shirt -->
    <path d="M 170 410 L 440 400 L 445 860 L 155 860 Z" fill="url(#plnRoyalBlue)" />
    
    <!-- Shirt Folds & Shading -->
    <path d="M 155 860 L 260 760 L 270 860 Z" fill="#1453AB" opacity="0.4" />
    <path d="M 445 860 L 370 740 L 420 860 Z" fill="#0C3D88" opacity="0.5" />

    <!-- Silver Reflective Stripe Across Chest (Authentic PLN spec) -->
    <g id="maleReflectiveStripe">
      <polygon points="163,570 435,575 433,618 160,612" fill="url(#silverStripe)" />
      <!-- Stitch lines top and bottom -->
      <line x1="163" y1="570" x2="435" y2="575" stroke="#475569" stroke-dasharray="4,3" stroke-width="1.5" />
      <line x1="160" y1="612" x2="433" y2="618" stroke="#475569" stroke-dasharray="4,3" stroke-width="1.5" />
    </g>

    <!-- Chest Pockets with Flaps -->
    <!-- Right Chest Pocket -->
    <rect x="175" y="525" width="90" height="95" rx="6" fill="#1453AB" />
    <path d="M 170 520 L 270 520 L 265 550 L 220 560 L 175 550 Z" fill="#0C3D88" />
    <circle cx="220" cy="540" r="4.5" fill="#0F172A" />

    <!-- Left Chest Pocket (Under Badge) -->
    <rect x="305" y="528" width="95" height="95" rx="6" fill="#1453AB" />
    <path d="M 300 523 L 405 523 L 400 553 L 352 563 L 305 553 Z" fill="#0C3D88" />
    <circle cx="352" cy="542" r="4.5" fill="#0F172A" />

    <!-- Yellow Square PLN Logo Badge on Left Chest -->
    <g transform="translate(365, 520)">
      <rect x="0" y="0" width="56" height="56" rx="6" fill="url(#plnYellowBadge)" stroke="#EAB308" stroke-width="2" />
      <!-- Red Lightning Bolt -->
      <polygon points="30,6 18,28 27,28 22,50 40,24 30,24" fill="#DC2626" />
      <!-- Three Blue Waves -->
      <path d="M 10 44 Q 28 40 46 44" stroke="#0072B5" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 10 48 Q 28 44 46 48" stroke="#0072B5" stroke-width="2.5" fill="none" stroke-linecap="round" />
    </g>

    <!-- Central Placket & Buttons -->
    <rect x="280" y="415" width="28" height="445" fill="#0F4290" />
    <circle cx="294" cy="460" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="294" cy="540" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="294" cy="650" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="294" cy="740" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
    <circle cx="294" cy="820" r="5" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />

    <!-- Shirt Collars -->
    <polygon points="230,390 290,440 250,460" fill="#0E387A" stroke="#082554" stroke-width="1" />
    <polygon points="340,390 280,440 320,460" fill="#104494" stroke="#082554" stroke-width="1" />

    <!-- Right Arm (Raised Enthusiastic Clenched Fist) -->
    <!-- Bicep -->
    <path d="M 180 430 L 75 480 L 40 370 L 105 350 L 140 410 Z" fill="url(#plnRoyalBlue)" />
    <!-- Forearm Going Upwards -->
    <path d="M 40 370 L 60 280 L 125 275 L 115 360 Z" fill="url(#plnDarkBlue)" />
    <path d="M 110 340 L 60 370 L 100 380 Z" fill="#0A2C63" opacity="0.6" />

    <!-- Clenched Fist of Determination -->
    <g id="maleFist">
      <!-- Base fist -->
      <ellipse cx="90" cy="245" rx="34" ry="28" fill="url(#maleSkin)" />
      <!-- Knuckles -->
      <circle cx="70" cy="235" r="11" fill="url(#maleSkin)" stroke="#DE9E78" stroke-width="1.5" />
      <circle cx="88" cy="230" r="12" fill="url(#maleSkin)" stroke="#DE9E78" stroke-width="1.5" />
      <circle cx="106" cy="235" r="11" fill="url(#maleSkin)" stroke="#DE9E78" stroke-width="1.5" />
      <!-- Curled Thumb -->
      <path d="M 110 240 C 118 255, 108 270, 95 272 C 85 272, 80 265, 82 255" fill="url(#maleShadowSkin)" stroke="#CE825E" stroke-width="2" />
      <!-- Creases -->
      <path d="M 72" y1="245" d="M 72 245 Q 88 248 105 245" stroke="#CE825E" stroke-width="2.5" fill="none" />
    </g>

    <!-- Neck & Throat -->
    <path d="M 260 340 L 315 340 L 318 410 L 257 410 Z" fill="url(#maleShadowSkin)" />
    <polygon points="275,370 290,395 305,370" fill="#CE825E" />

    <!-- Head & Handsome Cheerful Face -->
    <ellipse cx="288" cy="275" rx="55" ry="68" fill="url(#maleSkin)" />
    
    <!-- Ears -->
    <ellipse cx="233" cy="275" rx="10" ry="18" fill="#F3B99B" stroke="#DF9A78" stroke-width="1.5" />
    <ellipse cx="343" cy="275" rx="10" ry="18" fill="#F3B99B" stroke="#DF9A78" stroke-width="1.5" />

    <!-- Hair Peaks from Under Helmet -->
    <path d="M 235 240 C 235 210, 340 210, 340 240 Z" fill="url(#hairDark)" />
    <!-- Sideburns -->
    <path d="M 238 240 L 243 275 L 248 250 Z" fill="url(#hairDark)" />
    <path d="M 338 240 L 333 275 L 328 250 Z" fill="url(#hairDark)" />

    <!-- Confident Eyebrows -->
    <path d="M 255 245 Q 270 238 280 246" stroke="#1E1615" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <path d="M 296 246 Q 306 238 321 245" stroke="#1E1615" stroke-width="4.5" fill="none" stroke-linecap="round" />

    <!-- Bright, Warm Almond Eyes -->
    <ellipse cx="268" cy="258" rx="8" ry="5.5" fill="#1C1412" />
    <circle cx="266" cy="256" r="2.5" fill="#FFFFFF" />
    <ellipse cx="308" cy="258" rx="8" ry="5.5" fill="#1C1412" />
    <circle cx="306" cy="256" r="2.5" fill="#FFFFFF" />

    <!-- Nose with definition -->
    <path d="M 288 252 L 285 278 L 293 280" stroke="#CE825E" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Broad, Joyful Smile Showing Teeth -->
    <path d="M 264 296 Q 288 326 312 296 Z" fill="#881337" />
    <!-- White Upper Teeth -->
    <path d="M 267 297 Q 288 308 309 297 Z" fill="#FFFFFF" />
    <!-- Lower Lip Highlight -->
    <path d="M 275 324 Q 288 328 301 324" stroke="#FDA4AF" stroke-width="2" fill="none" />

    <!-- White Safety Hardhat (Industrial Helmet) -->
    <g id="whiteHardhat" filter="url(#innerDepth)">
      <!-- Brim -->
      <ellipse cx="288" cy="235" rx="78" ry="18" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2" />
      <ellipse cx="288" cy="232" rx="76" ry="16" fill="#F8FAFC" />
      
      <!-- Helmet Dome -->
      <path d="M 222 230 C 215 110, 360 110, 354 230 Z" fill="url(#hardhatWhite)" stroke="#94A3B8" stroke-width="2" />
      
      <!-- Central Ridge / Crown -->
      <path d="M 280 120 C 285 110, 291 110, 296 120 L 302 225 L 274 225 Z" fill="#FFFFFF" opacity="0.9" />

      <!-- Yellow Square PLN Logo on Helmet Front -->
      <g transform="translate(268, 142)">
        <rect x="0" y="0" width="40" height="40" rx="5" fill="url(#plnYellowBadge)" stroke="#EAB308" stroke-width="2" />
        <!-- Red Lightning -->
        <polygon points="22,4 13,20 20,20 16,36 29,17 22,17" fill="#DC2626" />
        <!-- Waves -->
        <line x1="7" y1="32" x2="33" y2="32" stroke="#0072B5" stroke-width="2.5" stroke-linecap="round" />
        <line x1="7" y1="35" x2="33" y2="35" stroke="#0072B5" stroke-width="2" stroke-linecap="round" />
      </g>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 2. RIGHT OFFICER: FEMALE PPID OFFICER (BLAZER BIRU PLN)  -->
  <!-- ======================================================== -->
  <g id="plnCustomerOfficer" filter="url(#softShadow)">
    <!-- Suit Trousers / Lower Body -->
    <path d="M 500 850 L 830 850 L 790 1200 L 520 1200 Z" fill="url(#plnDarkBlue)" />
    <!-- Trousers Crease Line -->
    <line x1="610" y1="870" x2="630" y2="1200" stroke="#0F3875" stroke-width="2" />
    <line x1="720" y1="870" x2="740" y2="1200" stroke="#0F3875" stroke-width="2" />

    <!-- Dark Wavy Luxurious Hair (Behind shoulders) -->
    <path d="M 540 280 C 470 330, 480 500, 530 550 C 560 510, 540 380, 570 300 Z" fill="url(#hairDark)" />
    <path d="M 700 280 C 780 330, 800 500, 740 550 C 720 510, 730 380, 690 300 Z" fill="url(#hairDark)" />

    <!-- Crisp White Collared Dress Shirt (V-neck opening) -->
    <polygon points="615,410 645,510 655,410" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <polygon points="675,410 645,510 635,410" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <polygon points="605,395 645,450 630,465" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <polygon points="685,395 645,450 660,465" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

    <!-- Tailored Royal Blue Blazer Torso -->
    <path d="M 535 425 L 775 425 L 765 865 L 530 865 Z" fill="url(#plnBlazerBlue)" />
    
    <!-- Blazer Left Lapel (Viewer's Left) -->
    <polygon points="565,425 620,550 645,550 595,425" fill="url(#plnLapelBlue)" stroke="#0E3977" stroke-width="1" />
    <!-- Blazer Right Lapel (Viewer's Right) with Yellow PLN Pin -->
    <polygon points="745,425 670,550 645,550 715,425" fill="url(#plnLapelBlue)" stroke="#0E3977" stroke-width="1" />

    <!-- Yellow PLN Square Logo Pin on Lapel -->
    <g transform="translate(668, 488)">
      <rect x="0" y="0" width="34" height="34" rx="4" fill="url(#plnYellowBadge)" stroke="#EAB308" stroke-width="1.5" />
      <!-- Red Lightning -->
      <polygon points="18,3 11,17 17,17 13,30 24,14 18,14" fill="#DC2626" />
      <!-- Waves -->
      <line x1="6" y1="26" x2="28" y2="26" stroke="#0072B5" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="29" x2="28" y2="29" stroke="#0072B5" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Blazer Front Button & Seams -->
    <circle cx="645" cy="670" r="7" fill="#0F172A" stroke="#475569" stroke-width="1.5" />
    <!-- Waist Pockets with Flaps -->
    <rect x="545" y="700" width="75" height="18" rx="4" fill="#0D3F8D" />
    <rect x="685" y="700" width="80" height="18" rx="4" fill="#0D3F8D" />

    <!-- Left Arm Holding Modern Digital Tablet -->
    <path d="M 545 440 L 490 530 L 515 670 L 590 650 L 575 580 L 550 490 Z" fill="url(#plnBlazerBlue)" />
    
    <!-- Digital Tablet held upright/horizontally -->
    <g id="digitalTablet" transform="rotate(-6 550 620)">
      <!-- Tablet Body -->
      <rect x="460" y="550" width="160" height="115" rx="12" fill="url(#tabletMetallic)" stroke="#64748B" stroke-width="3" />
      <!-- Screen with PPID Data & Visual Glow -->
      <rect x="470" y="560" width="140" height="95" rx="8" fill="#001D34" />
      <!-- Camera dot -->
      <circle cx="540" cy="556" r="2.5" fill="#64748B" />
      <!-- Graphical charts on tablet screen -->
      <rect x="480" y="570" width="45" height="10" rx="3" fill="#FFD100" />
      <rect x="480" y="590" width="120" height="6" rx="2" fill="#38BDF8" opacity="0.9" />
      <rect x="480" y="605" width="95" height="5" rx="2" fill="#E2E8F0" opacity="0.8" />
      <rect x="480" y="618" width="75" height="5" rx="2" fill="#E2E8F0" opacity="0.8" />
      <circle cx="585" cy="635" r="9" fill="#10B981" />
      <polyline points="581,635 584,638 590,632" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Fingers Gripping Tablet Edge -->
      <path d="M 475 550 C 475 538, 505 538, 505 550 Z" fill="url(#femaleSkin)" stroke="#EEAA94" stroke-width="1.5" />
      <path d="M 510 550 C 510 538, 540 538, 540 550 Z" fill="url(#femaleSkin)" stroke="#EEAA94" stroke-width="1.5" />
    </g>

    <!-- Right Arm Giving Confident Thumbs-Up Gesture -->
    <path d="M 765 440 L 830 520 L 815 650 L 755 640 L 775 540 Z" fill="url(#plnBlazerBlue)" />
    
    <!-- Sleeve Cuff with Buttons -->
    <circle cx="800" cy="625" r="3.5" fill="#0A2C63" />
    <circle cx="805" cy="635" r="3.5" fill="#0A2C63" />

    <!-- Thumbs Up Hand -->
    <g id="femaleThumbsUp">
      <!-- Palm and Curled Fingers -->
      <rect x="760" y="560" width="34" height="32" rx="9" fill="url(#femaleSkin)" stroke="#EEAA94" stroke-width="1.5" />
      <line x1="765" y1="570" x2="790" y2="570" stroke="#DF9A78" stroke-width="2" />
      <line x1="765" y1="578" x2="790" y2="578" stroke="#DF9A78" stroke-width="2" />
      <line x1="765" y1="586" x2="790" y2="586" stroke="#DF9A78" stroke-width="2" />

      <!-- Thumb Pointing Proudly Upward -->
      <path d="M 780 570 L 784 500 C 784 485, 808 485, 808 500 L 802 570 Z" fill="url(#femaleSkin)" stroke="#EEAA94" stroke-width="2" />
      <!-- Neat Fingernail -->
      <ellipse cx="796" cy="497" rx="4.5" ry="6" fill="#FCE7F3" stroke="#F472B6" stroke-width="1" />
    </g>

    <!-- Graceful Neck -->
    <path d="M 625 340 L 665 340 L 668 410 L 622 410 Z" fill="url(#femaleSkin)" />
    <!-- Neck shadow from chin -->
    <path d="M 630 340 Q 645 365 660 340 Z" fill="#EEAA94" />

    <!-- Cheerful, Beautiful Face -->
    <ellipse cx="645" cy="280" rx="50" ry="62" fill="url(#femaleSkin)" />
    
    <!-- Ears -->
    <ellipse cx="598" cy="280" rx="8" ry="15" fill="#FAC8B4" stroke="#EEAA94" stroke-width="1.5" />
    <ellipse cx="692" cy="280" rx="8" ry="15" fill="#FAC8B4" stroke="#EEAA94" stroke-width="1.5" />

    <!-- Side Hair Framing the Face (Wavy Brown Curls) -->
    <path d="M 598 230 C 580 270, 585 340, 605 380 C 590 330, 595 280, 615 250 Z" fill="url(#hairDark)" />
    <path d="M 692 230 C 710 270, 705 340, 685 380 C 700 330, 695 280, 675 250 Z" fill="url(#hairDark)" />

    <!-- Soft, Defined Eyebrows -->
    <path d="M 612 250 Q 625 244 636 250" stroke="#261A18" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 654 250 Q 665 244 678 250" stroke="#261A18" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Sparkling, Friendly Eyes with Eyelashes -->
    <ellipse cx="625" cy="264" rx="7.5" ry="5.5" fill="#1C1412" />
    <circle cx="623" cy="262" r="2.5" fill="#FFFFFF" />
    <path d="M 616 259 Q 625 255 634 259" stroke="#000000" stroke-width="2.5" fill="none" />
    
    <ellipse cx="665" cy="264" rx="7.5" ry="5.5" fill="#1C1412" />
    <circle cx="663" cy="262" r="2.5" fill="#FFFFFF" />
    <path d="M 656 259 Q 665 255 674 259" stroke="#000000" stroke-width="2.5" fill="none" />

    <!-- Sweet Feminine Nose -->
    <path d="M 645 260 L 643 282 L 648 284" stroke="#EEAA94" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="612" cy="285" r="14" fill="#FDA4AF" opacity="0.35" />
    <circle cx="678" cy="285" r="14" fill="#FDA4AF" opacity="0.35" />

    <!-- Radiant, Warm Smile with Teeth and Rose Lip Color -->
    <path d="M 622 300 Q 645 328 668 300 Z" fill="#BE123C" />
    <path d="M 625 301 Q 645 311 665 301 Z" fill="#FFFFFF" />
    <!-- Lower Lip Gloss Highlight -->
    <path d="M 632 324 Q 645 328 658 324" stroke="#FECDD3" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Voluminous Hair Top / Bangs -->
    <path d="M 598 235 C 610 185, 680 185, 692 235 C 670 215, 620 215, 598 235 Z" fill="url(#hairDark)" />
  </g>
</svg>
